<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spagetti — Recipe Search</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <div id="search-container" class="search-section">
            <h1 class="app-title">Spagetti</h1>
            <p class="app-tagline">Find meals by name</p>
            <form class="search-form" onsubmit="searchRecipes(document.getElementById('search').value); return false;">
                <label for="search" class="sr-only">Search for a meal</label>
                <input type="text" id="search" name="search" placeholder="e.g. pasta, chicken, salad…" required autocomplete="off">
                <button type="submit" class="btn-search">Search</button>
            </form>
        </div>
        <div id="results-container" class="results-section hidden">
            <div class="results-header">
                <button type="button" class="btn-back" onclick="showSearch()" aria-label="Back to search">← Search again</button>
                <h2 class="results-title">Results</h2>
            </div>
            <div id="loading-state" class="loading-state hidden" aria-live="polite">
                <div class="spinner" aria-hidden="true"></div>
                <p>Loading meals...</p>
            </div>
            <div id="results-grid" class="results-grid"></div>
            <p id="no-results" class="no-results hidden">No meals found. Try another search.</p>
        </div>
    </div>

    <div id="meal-modal" class="meal-modal hidden" role="dialog" aria-modal="true" aria-labelledby="meal-modal-title">
        <div class="meal-modal-content">
            <button type="button" class="modal-close" onclick="closeMealDetails()" aria-label="Close meal details">×</button>
            <img id="modal-image" class="modal-image" src="" alt="">
            <div class="modal-body">
                <p id="modal-category" class="modal-category"></p>
                <h3 id="meal-modal-title" class="modal-title"></h3>
                <h4>Ingredients</h4>
                <ul id="modal-ingredients" class="modal-ingredients"></ul>
                <h4>Instructions</h4>
                <p id="modal-instructions" class="modal-instructions"></p>
                <a id="modal-youtube" class="modal-youtube hidden" href="#" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
